apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.fullname }}-secrets
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  DATABASE_URL: {{ .Values.secrets.DATABASE_URL | quote }}
  SECRET_KEY_BASE: {{ .Values.secrets.SECRET_KEY_BASE | quote }}
  ROUTEBOX_INTERNAL_API_TOKEN: {{ .Values.secrets.ROUTEBOX_INTERNAL_API_TOKEN | quote }}
