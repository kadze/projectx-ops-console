fullname: routebox-ops-console

replicaCount: 2

image:
  repository: 414866527708.dkr.ecr.us-east-1.amazonaws.com/ops-console
  tag: latest
  pullPolicy: IfNotPresent

namespace: ops-console

service:
  type: ClusterIP
  port: 3000

config:
  RAILS_ENV: production
  RAILS_LOG_TO_STDOUT: "1"
  RAILS_SERVE_STATIC_FILES: "1"
  AWS_REGION: us-east-1
  REDIS_URL: "redis://routebox-staging-ops-console.xxxxxx.cache.amazonaws.com:6379/0"
  ROUTEBOX_SHIPMENTS_API_BASE_URL: "http://routebox-shipments-api.shipments-api.svc.cluster.local:3000"

secrets:
  DATABASE_URL: ""
  SECRET_KEY_BASE: ""
  ROUTEBOX_INTERNAL_API_TOKEN: ""

resources:
  requests:
    cpu: 150m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

livenessProbe:
  httpGet:
    path: /healthz
    port: 3000
  initialDelaySeconds: 30
  periodSeconds: 15
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /readyz
    port: 3000
  initialDelaySeconds: 30
  periodSeconds: 10
  failureThreshold: 3
