default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000
  url: <%= ENV['DATABASE_URL'] %>

development:
  <<: *default

test:
  <<: *default
  url: <%= ENV.fetch('TEST_DATABASE_URL', ENV['DATABASE_URL']) %>

production:
  <<: *default
  # DATABASE_URL is populated by config/initializers/secrets_loader.rb
  # at boot from routebox/<env>/DATABASE_URL in Secrets Manager.
